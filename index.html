  .sync-btn:hover { background: #1e293b; color: #fff; }

  .cat-bar {
    display: flex; gap: 6px; background: #1e293b; padding: 8px 12px;

  .cat-btn {
    flex: 0 0 auto; padding: 9px 16px; border: none; border-radius: 30px;

  }
  .cat-btn:hover { background: #475569; color: #fff; }
  .cat-btn.active { background: #3b5bdb; color: #fff; }

  .form-bar {
    display: flex; gap: 6px; background: #f1f5f9; padding: 10px 14px;

  }
  .form-btn {

  .form-btn.active { background: #3b5bdb; color: #fff; border-color: #3b5bdb; }

  .app-frame {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    border: none; display: none; background: #fff;

  .app-frame.active { display: block; }
  .frame-loading {

    display: flex; align-items: center; justify-content: center;

function decodeB64Utf8(b64){
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
}

/* ---------- Cloud Sync settings (shared across all embedded forms via same-origin localStorage) ---------- */
const CLOUD_KEY = 'dhassFormsGasUrl';
function setSyncStatus(text){
    const el = document.getElementById('syncStatus');
    if(el) el.textContent = text;
}
function promptCloudUrl(){
    const current = localStorage.getItem(CLOUD_KEY) || '';
    const val = prompt('Dhass Forms Apps Script Web App URL-ஐ ஒட்டவும்:\n(Code.gs-ஐ Deploy செய்த பிறகு கிடைக்கும் URL)', current);
    if(val === null) return;
    const url = val.trim();
    localStorage.setItem(CLOUD_KEY, url);
    setSyncStatus(url ? '☁️ Cloud Sync தயார்' : '☁️ Cloud Sync அமைக்கப்படவில்லை');
}
if(localStorage.getItem(CLOUD_KEY)){
    setSyncStatus('☁️ Cloud Sync தயார்');
}

/* ---------- UI building ---------- */
let currentCategory = null;
let currentForm = null;
const loadedFrames = {};

function buildCatBar(){
    const bar = document.getElementById('catBar');
    bar.innerHTML = '';
    CATEGORIES.forEach(function(cat){
        const btn = document.createElement('button');
        btn.className = 'cat-btn';
        btn.dataset.cat = cat.id;
        btn.textContent = cat.label;
        btn.onclick = function(){ selectCategory(cat.id); };
        bar.appendChild(btn);
    });
}

function selectCategory(catId){
    currentCategory = catId;
    document.querySelectorAll('.cat-btn').forEach(function(b){
        b.classList.toggle('active', b.dataset.cat === catId);
    });
    buildFormBar(catId);
}

function buildFormBar(catId){
    const cat = CATEGORIES.find(function(c){ return c.id === catId; });
    const bar = document.getElementById('formBar');
    bar.innerHTML = '';
    if(!cat) return;
    cat.forms.forEach(function(slug){
        const meta = FORM_META[slug];
        const btn = document.createElement('button');
        btn.className = 'form-btn';
        btn.dataset.form = slug;
        btn.innerHTML = '<span>' + meta.icon + '</span><span>' + meta.title + '</span>';
        btn.onclick = function(){ selectForm(slug); };
        bar.appendChild(btn);
    });
}

function selectForm(slug){
    currentForm = slug;
    document.querySelectorAll('.form-btn').forEach(function(b){
        b.classList.toggle('active', b.dataset.form === slug);
    });
    const hint = document.getElementById('emptyHint');
    if(hint) hint.style.display = 'none';

    document.querySelectorAll('.app-frame').forEach(function(f){ f.classList.remove('active'); });

    let frame = document.getElementById('frame-' + slug);
    const frameArea = document.getElementById('frameArea');
    if(!frame){
        frame = document.createElement('iframe');
        frame.id = 'frame-' + slug;
        frame.className = 'app-frame';
        frame.title = FORM_META[slug].title;
        frameArea.appendChild(frame);
    }
    frame.classList.add('active');

    if(!loadedFrames[slug]){
        const loading = document.createElement('div');
        loading.className = 'frame-loading';
        loading.id = 'loading-' + slug;
        loading.textContent = 'ஏற்றுகிறது...';
        frameArea.appendChild(loading);

        const watchdog = setTimeout(function(){
            const l = document.getElementById('loading-' + slug);
            if(l && !loadedFrames[slug]){
                l.innerHTML = '';
                const msg = document.createElement('div');
                msg.style.textAlign = 'center';
                msg.innerHTML = '⚠️ ஏற்றுவதில் தாமதம். கீழே உள்ள பொத்தானை அழுத்தவும்.<br><br>';
                const retryBtn = document.createElement('button');
                retryBtn.textContent = '🔄 மீண்டும் முயற்சி';
                retryBtn.style.cssText = 'padding:8px 16px;border:none;border-radius:6px;background:#3b5bdb;color:#fff;font-weight:bold;cursor:pointer;font-size:0.85rem;';
                retryBtn.onclick = function(){
                    delete loadedFrames[slug];
                    const oldFrame = document.getElementById('frame-' + slug);
                    if(oldFrame) oldFrame.remove();
                    if(l) l.remove();
                    selectForm(slug);
                };
                msg.appendChild(retryBtn);
                l.appendChild(msg);
            }
        }, 8000);

        setTimeout(function(){
            try {
                const decoded = decodeB64Utf8(B64_DATA[slug]);
                frame.srcdoc = decoded;
            } catch(err) {
                clearTimeout(watchdog);
                const l = document.getElementById('loading-' + slug);
                if(l) l.textContent = '⚠️ ஏற்றுவதில் பிழை: ' + err.message;
                return;
            }
            frame.onload = function(){
                loadedFrames[slug] = true;
                clearTimeout(watchdog);
                const l = document.getElementById('loading-' + slug);
                if(l) l.remove();
            };
        }, 10);
    }
}

buildCatBar();
selectCategory(CATEGORIES[0].id);
</script>
